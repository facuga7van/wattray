name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release
      - run: cargo build --release
      - uses: softprops/action-gh-release@v2
        with:
          files: target/release/wattray.exe
          generate_release_notes: true
      # Opens the PR to microsoft/winget-pkgs. Needs a classic PAT with public_repo in WINGET_TOKEN.
      - if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@main
        with:
          identifier: facuga7van.wattray
          installers-regex: 'wattray\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}
