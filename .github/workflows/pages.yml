name: pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Separate jobs, like GitHub's template: deploying in the same job right after the upload raced
  # the artifact API ("No artifacts named github-pages") and failed until re-run.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
      # Tells IndexNow (Bing, Yandex...) the page changed. A failure does not fail the deploy.
      - name: Notify IndexNow
        continue-on-error: true
        run: >-
          curl -s -X POST https://api.indexnow.org/indexnow
          -H 'Content-Type: application/json; charset=utf-8'
          -d '{"host":"wattray.wampaland.com.ar","key":"37818453cf682d4afe3fb54769f9fd62","keyLocation":"https://wattray.wampaland.com.ar/37818453cf682d4afe3fb54769f9fd62.txt","urlList":["https://wattray.wampaland.com.ar/"]}'
          -w '%{http_code}\n'
